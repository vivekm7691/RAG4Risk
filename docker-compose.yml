services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SKIP_MODEL_DOWNLOAD: ${SKIP_MODEL_DOWNLOAD:-false}
    container_name: rag4risk-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-300.0}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-rag4risk_documents}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - TOP_K=${TOP_K:-5}
      # SSL Configuration for HuggingFace model downloads
      # Set HF_HUB_DISABLE_SSL_VERIFY=true if you have corporate proxy with self-signed certificates
      - HF_HUB_DISABLE_SSL_VERIFY=${HF_HUB_DISABLE_SSL_VERIFY:-false}
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - huggingface_cache:/root/.cache/huggingface  # Persist HuggingFace model cache
    depends_on:
      - qdrant
      - ollama
    networks:
      - rag4risk-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag4risk-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - rag4risk-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag4risk-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag4risk-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    container_name: rag4risk-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag4risk-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 8G

volumes:
  backend_data:
  qdrant_data:
  ollama_data:
  huggingface_cache:  # Persist HuggingFace model cache to avoid re-downloading

networks:
  rag4risk-network:
    driver: bridge

