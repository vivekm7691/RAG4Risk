services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag4risk-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-rag4risk_documents}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - TOP_K=${TOP_K:-5}
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    depends_on:
      - chroma
    networks:
      - rag4risk-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag4risk-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - rag4risk-network
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: rag4risk-chroma
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - rag4risk-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama service (optional - for production)
  # Uncomment if you want to run Ollama in Docker instead of on host
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: rag4risk-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - rag4risk-network
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         memory: 8G

volumes:
  backend_data:
  chroma_data:
  # ollama_data:  # Uncomment if using Ollama container

networks:
  rag4risk-network:
    driver: bridge

